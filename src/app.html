<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F4F1" />
    <meta name="apple-itunes-app" content="app-id=6748095680" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700;800&display=swap"
    />
    <!-- Google tag (gtag.js), basic consent mode: GA doesn't load until the visitor accepts the cookie banner. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      function loadAnalytics() {
        if (window.gaLoaded) return;
        window.gaLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-4G2J85JT43';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-4G2J85JT43');
      }
      try {
        if (localStorage.getItem('cookie-consent') === 'granted') loadAnalytics();
        else
          // Clears cookies left from an earlier accept, before GA could rewrite them.
          // GA sets them on the top domain, so www.picpark.app has to clear .picpark.app too.
          document.cookie.split('; ').forEach(function (c) {
            var name = c.split('=')[0];
            if (name.indexOf('_ga') !== 0) return;
            document.cookie = name + '=; max-age=0; path=/';
            var parts = location.hostname.split('.');
            for (var i = 0; i < parts.length - 1; i++) document.cookie = name + '=; max-age=0; path=/; domain=.' + parts.slice(i).join('.');
          });
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
